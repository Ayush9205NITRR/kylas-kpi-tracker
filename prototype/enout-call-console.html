<title>Enout Call Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#F2F5F4; --panel:#FFFFFF; --panel2:#F6F9F8; --panel3:#EAF0EF;
  --line:#D6DEDC; --line2:#C3CFCC;
  --text:#12201F; --text2:#5A6B69; --text3:#879997;
  --accent:#0B6E6E; --accentSoft:#DFEEEC; --accentLine:#7FBDB8; --onAccent:#FFFFFF;
  --live:#0F7A57; --liveSoft:#DCEFE7;
  --stop:#B03349; --stopSoft:#FAE4E8;
  --flag:#A85A11; --flagSoft:#FBEEDC; --flagLine:#E0AE6B;
  --f:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A1315; --panel:#0F1B1E; --panel2:#132124; --panel3:#182A2E;
  --line:#22363A; --line2:#2F4A4E;
  --text:#E3EDEB; --text2:#94ACA9; --text3:#6C8482;
  --accent:#42B3AB; --accentSoft:#10302E; --accentLine:#2A6D69; --onAccent:#06171A;
  --live:#3EC091; --liveSoft:#0E2C23;
  --stop:#E67D90; --stopSoft:#2F1920;
  --flag:#DFA855; --flagSoft:#2E2310; --flagLine:#7A5E2A;
}}
:root[data-theme="dark"]{
  --ground:#0A1315; --panel:#0F1B1E; --panel2:#132124; --panel3:#182A2E;
  --line:#22363A; --line2:#2F4A4E;
  --text:#E3EDEB; --text2:#94ACA9; --text3:#6C8482;
  --accent:#42B3AB; --accentSoft:#10302E; --accentLine:#2A6D69; --onAccent:#06171A;
  --live:#3EC091; --liveSoft:#0E2C23;
  --stop:#E67D90; --stopSoft:#2F1920;
  --flag:#DFA855; --flagSoft:#2E2310; --flagLine:#7A5E2A;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2{margin:0;letter-spacing:-.012em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
kbd{font-family:var(--m);font-size:10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 4px;background:var(--panel2);color:var(--text2)}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}

/* ── top bar ─────────────────────────────── */
.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px}
.bar .id{display:flex;align-items:center;gap:8px;flex:none}
.bar .g{width:24px;height:24px;border-radius:5px;background:var(--accent);color:var(--onAccent);display:grid;place-items:center;font-weight:700;font-size:10.5px}
.bar h1{font-size:14px;font-weight:700}
.bar .sp{flex:1}
.pace{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);flex:none}
.pace b{font-family:var(--m);font-size:13px;color:var(--text);font-weight:500}
.meter{width:76px;height:5px;border-radius:3px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.gbtn{background:transparent;border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--text2)}
.gbtn:hover{border-color:var(--accent);color:var(--accent)}
.gbtn.on{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
.pbtn{background:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--onAccent)}
.pbtn:hover{filter:brightness(1.08)}

/* ── call bar ────────────────────────────── */
.callbar{background:var(--panel3);border-bottom:1px solid var(--line);padding:9px 14px}
.cbIn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.who{display:flex;flex-direction:column;min-width:0;flex:0 1 190px}
.who b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:11.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dial{display:flex;align-items:center;gap:0;flex:none}
.dial a{
  display:flex;align-items:center;gap:7px;text-decoration:none;
  background:var(--live);color:#fff;border-radius:6px 0 0 6px;padding:7px 12px;
  font-family:var(--m);font-size:12.5px;font-weight:500;border:1px solid var(--live);
}
:root[data-theme="dark"] .dial a,:root:not([data-theme="light"]) .dial a{color:#06171A}
.dial a:hover{filter:brightness(1.08)}
.dial .tm{
  font-family:var(--m);font-size:12.5px;min-width:56px;text-align:center;
  border:1px solid var(--line2);border-left:0;border-radius:0 6px 6px 0;padding:7px 8px;
  background:var(--panel);color:var(--text2);
}
.dial .tm.run{color:var(--live);border-color:var(--live);background:var(--liveSoft)}
.ocs{display:flex;gap:5px;flex-wrap:wrap;flex:1 1 auto}
.oc{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap}
.oc:hover{border-color:var(--accent)}
.oc[aria-pressed="true"]{border-color:var(--accent);background:var(--accentSoft);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.nextbtn{flex:none}
@media(max-width:760px){.who{flex:1 1 100%}.ocs{order:5}.nextbtn{flex:1 1 100%}.nextbtn button{width:100%}}

/* ── body ────────────────────────────────── */
.mid{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0}
.mid.noq{grid-template-columns:minmax(0,1fr)}
.mid.noq .queue{display:none}
@media(max-width:860px){.mid{grid-template-columns:minmax(0,1fr)}.queue{display:none}}
.queue{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.qtop{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:9px;z-index:2}
.qtop input{width:100%;border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:6px 9px;font-size:12.5px}
.qfil{display:flex;gap:4px;margin-top:7px}
.qf{flex:1;border:1px solid var(--line2);background:transparent;border-radius:5px;padding:3px 4px;font-size:10.5px;color:var(--text2)}
.qf[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.qlist{list-style:none;margin:0;padding:5px}
.qi{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px;display:flex;flex-direction:column;gap:2px}
.qi:hover{background:var(--panel2)}
.qi[aria-current="true"]{background:var(--accentSoft);border-color:var(--accentLine)}
.qi .n{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .c{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .s{display:flex;gap:5px;align-items:center;margin-top:2px}
.dotd{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.dotd.done{background:var(--live)}
.dotd.flag{background:var(--flag)}
.qi .st{font-family:var(--m);font-size:9.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qempty{padding:22px 12px;text-align:center;color:var(--text3);font-size:12px}

.right{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:0;min-width:0}
.pane{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.ph{background:var(--panel2);border-bottom:1px solid var(--line);padding:7px 14px;display:flex;align-items:center;gap:8px;font-family:var(--m);font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.ph .c{margin-left:auto;letter-spacing:0;text-transform:none;font-size:10.5px}
.pscroll{overflow-y:auto;min-height:0;container-type:inline-size}
@container (max-width:540px){.g2{grid-template-columns:1fr}}
#paneL .pscroll{background:var(--panel)}
#paneR .pscroll{background:var(--ground)}
.pwrap{max-width:660px;margin:0 auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:12px}
#formL{gap:20px}
.grp{display:flex;flex-direction:column;gap:12px}
.grpH{display:flex;align-items:center;gap:10px;font-family:var(--m);font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.grpH::after{content:"";flex:1;height:1px;background:var(--line)}
.grp .f{margin-bottom:0}
.rowFlex{display:flex;gap:12px;flex-wrap:wrap}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fhead label{margin-bottom:0;flex:1}
select.mini{width:auto;flex:none;border:1px solid var(--line2);background:var(--panel2);border-radius:4px;padding:2px 19px 2px 6px;font-size:10.5px;color:var(--text2);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 11px) 55%,calc(100% - 7px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
select.mini:hover{border-color:var(--accent);color:var(--accent)}
.withIcon{position:relative}
.withIcon .ic{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:3px;background:var(--panel3);color:var(--text3);display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:-.02em;pointer-events:none}
.withIcon .in{padding-left:31px}
.entry{display:flex;gap:6px;align-items:center}
.entry+.entry{margin-top:6px}
.entry input[type=radio]{accent-color:var(--accent);flex:none;width:14px;height:14px;margin:0}
.entry .cc{flex:0 0 50px;min-width:0}
.entry .ty2{flex:0 0 84px;min-width:0}
.entry .vl2{flex:1 1 60px;min-width:0}
.tabbar{display:none}
@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .pane{border-right:0}
  .ph{display:none}
  .tabbar{display:flex;gap:3px;background:var(--panel2);border-bottom:1px solid var(--line);padding:6px 10px}
  .tabbar button{flex:1;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px;font-size:12.5px;font-weight:500;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px}
  .tabbar button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--text)}
  .tabbar .n{font-family:var(--m);font-size:10px;color:var(--text3)}
  .split[data-tab="basic"] #paneR{display:none}
  .split[data-tab="more"] #paneL{display:none}
}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:9px}
.sh{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sh h2{font-size:14.5px;font-weight:700}
.sh p{margin:0;font-size:12px;color:var(--text2);flex:1 1 180px}
.sb{padding:14px 15px}
.collapsed .sb{display:none}
.shbtn{background:transparent;border:0;color:var(--text3);font-size:12px;padding:2px 6px;border-radius:4px;flex:none}
.shbtn:hover{background:var(--panel2);color:var(--text2)}

label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:4px}
.req{color:var(--stop)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 9px;font-size:13.5px}
textarea.in{resize:vertical;min-height:56px;line-height:1.5}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2>.f{min-width:0;margin-bottom:0}
@media(max-width:620px){.g2{grid-template-columns:1fr}}
.f{margin-bottom:12px}
.f:last-child{margin-bottom:0}

/* quick insert chips */
.qchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.qc{border:1px solid var(--line2);background:var(--panel2);border-radius:14px;padding:2px 8px;font-size:11px;color:var(--text2);font-family:var(--m)}
.qc:hover{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}

/* repeatable */
.multi{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mrow input[type=radio]{accent-color:var(--accent);flex:none;width:14px;height:14px;margin:0}
.mrow .ty{flex:0 0 100px}
.mrow .cc{flex:0 0 68px}
.mrow .vl{flex:1 1 150px;min-width:150px}
.mrow .dt{flex:1 1 102px;min-width:102px;width:auto}
.del{flex:none;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--text3);font-size:15px;line-height:1;padding:3px 6px}
.del:hover{color:var(--stop);background:var(--stopSoft)}
.add{background:transparent;border:0;color:var(--accent);font-size:12px;font-weight:500;padding:3px 0}
.add:hover{text-decoration:underline}
@media(max-width:620px){.mrow{flex-wrap:wrap}.mrow .ty{flex:1 1 90px}.mrow .vl{flex:1 1 100%}}

/* event rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:11px}
.rowh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rowh .n{font-family:var(--m);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);flex:1}
.empty{border:1px dashed var(--line2);border-radius:8px;padding:15px;text-align:center;color:var(--text3);font-size:12px}

/* single checkbox */
.cb1{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line2);border-radius:7px;padding:10px 12px;background:var(--panel);cursor:pointer;font-size:13.5px}
.cb1:hover{border-color:var(--accent)}
.cb1.on{border-color:var(--accent);background:var(--accentSoft)}
.cb1 input{accent-color:var(--accent);margin:2px 0 0;flex:none;width:16px;height:16px}
.cb1 em{display:block;font-style:normal;font-size:11.5px;color:var(--text2);margin-top:1px}

.locked{display:flex;gap:8px;align-items:flex-start;border:1px dashed var(--line2);border-radius:7px;padding:10px 12px;font-size:12px;color:var(--text2);background:var(--panel2)}
.locked b{font-family:var(--m);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);flex:none;padding-top:2px}
.skipnote{font-size:12.5px;color:var(--text2);padding:14px 15px}

/* footer */
.foot{background:var(--panel);border-top:1px solid var(--line);padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
.footIn{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.footIn .msg{flex:1;font-size:12px;color:var(--text2);min-width:120px}
.footIn .msg.bad{color:var(--stop)}
.flagbtn{border:1px solid var(--line2);background:transparent;border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--text2)}
.flagbtn.on{border-color:var(--flagLine);background:var(--flagSoft);color:var(--flag);font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,16,18,.5);display:grid;place-items:center;padding:16px;z-index:60}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:11px;width:min(460px,100%);max-height:84vh;overflow:auto}
.sheet .h{padding:14px 16px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet .h h3{margin:0;font-size:15px;font-weight:700;flex:1}
.sheet .b{padding:6px 16px 16px}
.krow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.krow:last-child{border-bottom:0}
.krow .kk{flex:none;width:92px;display:flex;gap:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);background:var(--text);color:var(--ground);font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:18px;z-index:70;display:flex;gap:10px;align-items:center}
.toast button{background:transparent;border:0;color:var(--ground);text-decoration:underline;font-size:12px;padding:0}
</style>

<div class="app">

  <header class="bar">
    <div class="id"><div class="g">EN</div><h1>Call console</h1></div>
    <div class="pace"><span>Today</span><b id="pcount">0</b><span class="meter"><i id="pbar" style="width:0%"></i></span><span id="ptarget">/ 100</span></div>
    <div class="sp"></div>
    <button class="gbtn" id="qToggle">Queue</button>
    <button class="gbtn" id="kbBtn">Shortcuts</button>
    <button class="gbtn" id="themeBtn">Theme</button>
    <button class="gbtn" id="newBtn">New contact</button>
  </header>

  <div class="callbar"><div class="cbIn" id="callbar"></div></div>

  <div class="mid" id="mid">
    <aside class="queue">
      <div class="qtop">
        <input id="q" type="search" placeholder="Search name, company, phone" aria-label="Search">
        <div class="qfil" id="qfil"></div>
      </div>
      <ul class="qlist" id="qlist"></ul>
    </aside>
    <div class="right">
      <div class="tabbar" role="tablist">
        <button role="tab" data-tab="basic" aria-selected="true">Basic info</button>
        <button role="tab" data-tab="more" aria-selected="false">Event &amp; vendor <span class="n" id="tabCount"></span></button>
      </div>
      <div class="split" id="split" data-tab="basic">
        <section class="pane" id="paneL">
          <div class="ph">Basic information<span class="c" id="phL"></span></div>
          <div class="pscroll" id="scrollL"><div class="pwrap" id="formL"></div></div>
        </section>
        <section class="pane" id="paneR">
          <div class="ph">Event &amp; vendor<span class="c" id="phR"></span></div>
          <div class="pscroll" id="scrollR"><div class="pwrap" id="formR"></div></div>
        </section>
      </div>
    </div>
  </div>

  <div class="foot"><div class="footIn">
    <span class="msg" id="msg"></span>
    <button class="flagbtn" id="flagBtn" type="button">⚑ Flag for cleanup</button>
    <button class="gbtn" id="resetBtn" type="button">Reset</button>
    <button class="pbtn" id="saveBtn" type="button">Save &amp; next</button>
  </div></div>
</div>

<script>
/* ── picklists ───────────────────────────── */
const SALUTATION=["","Mr.","Ms.","Mrs.","Dr."];
const EMAIL_TYPES=["Office","Personal","Other"];
const PHONE_TYPES=["Mobile","Work","Home","Other"];
const STAGES=["LinkedIn Outreach Initiated","Cold Call Initiated","Could Not Connect","Contacted","Wrong POC","Qualifying","Discovery Call Booked","Discovery Call Done","SQL — Active","Holding Pad","Lost"];
const MEETING_STAGES=["Discovery Call Booked","Discovery Call Done","SQL — Active"];
const SOURCES=["","Lost Deals","Apollo","LinkedIn Scrape","Referral","Inbound Enquiry","Event / Conference"];
const OFFSITE_TIMELINE=["","Q2 FY27","Q3 FY27","Q4 FY27","Q1 FY28","Q2 FY28","Not decided"];
const OWNERS=["","Shreya Bodwal","Ayush Tiwari"];
const EVENT_TYPES=["","Employee offsites","Product launch","Sales conference / dealer meet","Marketing events","Team-building activities","Other engagements"];
const VENDOR_INFO=["","Internal","Vendor Exists","First Event","No Info"];
const MODE_OF_MEETING=["","In Person","Virtual","Calls","Text"];

const OUTCOMES=[
  {k:"1",t:"No answer",   stage:"Could Not Connect"},
  {k:"2",t:"Wrong POC",   stage:"Wrong POC"},
  {k:"3",t:"Right POC",   stage:"Qualifying"},
  {k:"4",t:"Discovery",   stage:"Discovery Call Done"}
];
const QUICK={
  budget:["Approx","₹L","₹Cr","Not approved","Signed off","No budget yet","Last year was"],
  timeline:["Q2 FY27","Q3 FY27","Q4 FY27","Q1 FY28","Not decided","Month:","Tentative"],
  pax:["Approx","+ internal","incl. contractors","Only leadership","Whole company"]
};

/* ── data ────────────────────────────────── */
const emptyRow=()=>({eventType:"",budget:"",timeline:"",pax:"",remarks:""});
const blank=()=>({kid:"",salutation:"",pocName:"",company:"",linkedin:"",designation:"",
  emails:[{type:"Office",value:"",primary:true}],
  phones:[{type:"Mobile",cc:"+91",value:"",primary:true}],
  stage:"LinkedIn Outreach Initiated",nextCallDate:"",nextCallTime:"",
  source:"",remarks:"",offsiteTimeline:"",owner:"",

let cur=0, isNew=false, filter="todo", target=100;
let timer=null, secs=0, ringing=false;
let collapsed={past:false,current:false};
const rec=()=>DATA[cur];
const today=()=>new Date().toISOString().slice(0,10);

/* ── helpers ─────────────────────────────── */
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(l,v)=>l.map(o=>`<option value="${esc(o)}"${o===v?" selected":""}>${o===""?"Choose":esc(o)}</option>`).join("");
let undoState=null;
function toast(m,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=el("div","toast",`<span>${esc(m)}</span>`);
  if(undo){const b=el("button",null,"Undo");b.type="button";b.onclick=()=>{undo();t.remove();};t.appendChild(b);}
  document.body.appendChild(t);setTimeout(()=>t.remove(),4000);
}
function resetScroll(){
  document.getElementById("scrollL").scrollTo({top:0});
  document.getElementById("scrollR").scrollTo({top:0});
}
function setTab(t){
  document.getElementById("split").dataset.tab=t;
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false"));
}
function field(label,id,req,ctrl){
  const f=el("div","f");
  f.innerHTML=`<label for="${id}">${esc(label)}${req?' <span class="req">*</span>':""}</label>`;
  f.appendChild(ctrl);return f;
}
function input(id,val,ph,on,type){
  const i=el("input","in");i.id=id;i.type=type||"text";i.value=val||"";if(ph)i.placeholder=ph;
  i.oninput=e=>{on(e.target.value);validate();};return i;
}
function textarea(id,val,ph,on){
  const t=el("textarea","in");t.id=id;t.value=val||"";if(ph)t.placeholder=ph;
  t.oninput=e=>on(e.target.value);return t;
}
function select(id,list,val,on){
  const s=el("select","in");s.id=id;s.innerHTML=opts(list,val);
  s.onchange=e=>{on(e.target.value);validate();};return s;
}
/* long-text field with one-tap phrase inserts */
function quickField(label,id,val,ph,on,chips){
  const f=el("div","f");
  f.innerHTML=`<label for="${id}">${esc(label)}</label>`;
  const i=el("input","in");i.id=id;i.value=val||"";i.placeholder=ph;
  i.oninput=e=>on(e.target.value);
  f.appendChild(i);
  const w=el("div","qchips");
  chips.forEach(c=>{
    const b=el("button","qc",esc(c));b.type="button";b.tabIndex=-1;
    b.onclick=()=>{
      const v=i.value.trim();
      i.value=v?v+(/[,;]$/.test(v)?" ":", ")+c:c;
      on(i.value);i.focus();
      i.setSelectionRange(i.value.length,i.value.length);
    };
    w.appendChild(b);
  });
  f.appendChild(w);return f;
}

/* ── call bar ────────────────────────────── */
function renderCallbar(){
  const a=rec(),C=document.getElementById("callbar");C.innerHTML="";
  const ph=a.phones.find(p=>p.primary)||a.phones[0];
  const num=ph?(ph.cc+" "+ph.value).trim():"";

  const who=el("div","who",`<b>${esc(a.pocName||"New contact")}</b><span>${esc(a.company||"—")}${a.designation?" · "+esc(a.designation):""}</span>`);
  C.appendChild(who);

  const d=el("div","dial");
  const link=el("a",null,`<span>☏</span>${esc(num||"no number")}`);
  link.href=num?"tel:"+num.replace(/\s/g,""):"#";
  link.onclick=e=>{if(!num){e.preventDefault();return;}startTimer();};
  d.appendChild(link);
  const tm=el("span","tm"+(ringing?" run":""),fmtSecs(secs));
  tm.id="tm";d.appendChild(tm);
  C.appendChild(d);

  const ocs=el("div","ocs");
  OUTCOMES.forEach(o=>{
    const b=el("button","oc",`<kbd>${o.k}</kbd>${esc(o.t)}`);
    b.type="button";b.setAttribute("aria-pressed",a.stage===o.stage?"true":"false");
    b.onclick=()=>setOutcome(o);
    ocs.appendChild(b);
  });
  C.appendChild(ocs);

  const nb=el("div","nextbtn");
  const btn=el("button","pbtn",`Save &amp; next <kbd style="border-color:rgba(255,255,255,.35);background:transparent;color:inherit">⏎</kbd>`);
  btn.type="button";btn.onclick=saveNext;nb.appendChild(btn);
  C.appendChild(nb);
}
const fmtSecs=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function startTimer(){
  if(timer)clearInterval(timer);
  secs=0;ringing=true;
  timer=setInterval(()=>{secs++;const t=document.getElementById("tm");if(t)t.textContent=fmtSecs(secs);},1000);
  const t=document.getElementById("tm");if(t)t.className="tm run";
}
function stopTimer(){if(timer)clearInterval(timer);timer=null;ringing=false;const t=document.getElementById("tm");if(t)t.className="tm";}
function setOutcome(o){
  const a=rec();
  a.stage=o.stage;
  if(!a.nextCallDate&&o.stage==="Could Not Connect"){a.nextCallDate=today();}
  stopTimer();
  render();
  resetScroll();
  if(o.stage!=="Could Not Connect"&&matchMedia("(max-width:900px)").matches)setTab("more");
}

/* ── queue ───────────────────────────────── */
const FILTERS=[["todo","To call"],["flag","Flagged"],["all","All"]];
function renderFilters(){
  const w=document.getElementById("qfil");w.innerHTML="";
  FILTERS.forEach(([k,l])=>{
    const b=el("button","qf",l);b.type="button";
    b.setAttribute("aria-pressed",filter===k?"true":"false");
    b.onclick=()=>{filter=k;renderFilters();renderQueue();};
    w.appendChild(b);
  });
}
function visible(){
  const q=(document.getElementById("q").value||"").toLowerCase();
  return DATA.map((a,i)=>({a,i}))
    .filter(({a})=>!q||(a.pocName+" "+a.company+" "+a.phones.map(p=>p.value).join(" ")).toLowerCase().includes(q))
    .filter(({a})=>filter==="all"||(filter==="flag"?a.flagged:!a.done));
}
function renderQueue(){
  const L=document.getElementById("qlist");L.innerHTML="";
  const rows=visible();
  if(!rows.length){L.appendChild(el("li","qempty","Nothing here."));return;}
  rows.forEach(({a,i})=>{
    const li=el("li"),b=el("button","qi");
    b.type="button";b.setAttribute("aria-current",i===cur?"true":"false");
    b.innerHTML=`<span class="n">${esc(a.pocName)}</span><span class="c">${esc(a.company)}</span>
      <span class="s"><i class="dotd${a.done?" done":a.flagged?" flag":""}"></i><span class="st">${esc(a.stage)}</span></span>`;
    b.onclick=()=>{cur=i;isNew=false;stopTimer();secs=0;render();resetScroll();};
    li.appendChild(b);L.appendChild(li);
  });
}
function renderPace(){
  const n=DATA.filter(a=>a.done).length;
  document.getElementById("pcount").textContent=n;
  document.getElementById("ptarget").textContent="/ "+target;
  document.getElementById("pbar").style.width=Math.min(100,n/target*100)+"%";
}

/* ── form ────────────────────────────────── */
function render(){
  renderCallbar();renderQueue();renderPace();renderBasic();renderRight();validate();
}

function group(title,nodes){
  const g=el("div","grp");
  g.appendChild(el("div","grpH",`<span>${esc(title)}</span>`));
  nodes.forEach(n=>g.appendChild(n));
  return g;
}
function mini(list,val,on){
  const s=el("select","mini");s.innerHTML=opts(list,val);
  s.onchange=e=>on(e.target.value);return s;
}
/* Email / Phone: one entry shows just the value (type sits in the label row).
   Extra entries switch to full rows with a primary radio. */
function contactField(a,kind){
  const isPh=kind==="phones", list=a[kind];
  const TYPES=isPh?PHONE_TYPES:EMAIL_TYPES;
  const f=el("div","f");
  const head=el("div","fhead");
  head.innerHTML=`<label>${isPh?'Phone number <span class="req">*</span>':"Email"}</label>`;
  f.appendChild(head);

  const valueInput=e=>{
    const i=el("input","in vl2");
    i.type=isPh?"tel":"email";i.value=e.value;
    i.placeholder=isPh?"9876543210":"name@company.com";
    i.setAttribute("aria-label",isPh?"Phone number":"Email address");
    if(isPh)i.inputMode="tel";
    i.oninput=v=>{e.value=v.target.value;renderCallbar();validate();};
    return i;
  };
  const ccInput=e=>{
    const c=el("input","in cc");c.value=e.cc;c.setAttribute("aria-label","Country code");
    c.oninput=v=>{e.cc=v.target.value;renderCallbar();};return c;
  };

  if(list.length===1){
    const e=list[0];
    head.appendChild(mini(TYPES,e.type,v=>e.type=v));
    const row=el("div","entry");
    if(isPh)row.appendChild(ccInput(e));
    row.appendChild(valueInput(e));
    f.appendChild(row);
  }else{
    list.forEach((e,i)=>{
      const row=el("div","entry");
      const rd=el("input");rd.type="radio";rd.name=kind;rd.checked=e.primary;
      rd.setAttribute("aria-label","Primary");
      rd.onchange=()=>{list.forEach(x=>x.primary=false);e.primary=true;renderCallbar();};
      row.appendChild(rd);
      const ty=el("select","in ty2");ty.innerHTML=opts(TYPES,e.type);
      ty.setAttribute("aria-label","Type");ty.onchange=v=>e.type=v.target.value;
      row.appendChild(ty);
      if(isPh)row.appendChild(ccInput(e));
      row.appendChild(valueInput(e));
      const d=el("button","del","×");d.type="button";d.setAttribute("aria-label","Remove");
      d.onclick=()=>{list.splice(i,1);if(list.length&&!list.some(x=>x.primary))list[0].primary=true;render();};
      row.appendChild(d);
      f.appendChild(row);
    });
  }
  const add=el("button","add",isPh?"+ Add phone":"+ Add email");add.type="button";
  add.onclick=()=>{list.push(isPh?{type:"Mobile",cc:"+91",value:"",primary:!list.length}
                               :{type:"Office",value:"",primary:!list.length});render();};
  f.appendChild(add);
  return f;
}

  const t1=el("input","in dt");t1.type="time";t1.value=a.nextCallTime;t1.setAttribute("aria-label","Next call time");
  t1.oninput=e=>a.nextCallTime=e.target.value;ncr.appendChild(t1);
  ncd.appendChild(ncr);
  const qc=el("div","qchips");
  [["Tomorrow",1],["+3 days",3],["Next week",7]].forEach(([l,n])=>{
    const b=el("button","qc",l);b.type="button";b.tabIndex=-1;
    b.onclick=()=>{const dt=new Date();dt.setDate(dt.getDate()+n);a.nextCallDate=dt.toISOString().slice(0,10);render();};
    qc.appendChild(b);
  });
  ncd.appendChild(qc);

  const sRow=el("div","g2");
  sRow.appendChild(field("Pipeline stage — BD","f-stage",false,select("f-stage",STAGES,a.stage,v=>{a.stage=v;render();})));
  sRow.appendChild(ncd);

  const rRow=el("div","g2");
  rRow.appendChild(field("Remarks","f-rm",false,textarea("f-rm",a.remarks,"Notes on this contact",v=>a.remarks=v)));
  rRow.appendChild(field("Offsite timeline","f-ot",false,select("f-ot",OFFSITE_TIMELINE,a.offsiteTimeline,v=>a.offsiteTimeline=v)));

  W.appendChild(group("Stage & follow-up",[sRow,rRow]));
}

function renderRight(){
  const a=rec(),F=document.getElementById("formR");F.innerHTML="";
  const n=a.past.length+a.current.length;
  document.getElementById("phR").textContent=n?n+(n===1?" row":" rows"):"empty";
  document.getElementById("tabCount").textContent=n?String(n):"";

  /* no-answer short circuit */
  if(a.stage==="Could Not Connect"){
    const s=el("section","sec");
    s.innerHTML=`<div class="skipnote">No answer — nothing else to capture. Set a next call date on the left, then
      <kbd>⏎</kbd> to save and move to the next contact.</div>`;
    F.appendChild(s);return;
  }

  F.appendChild(eventSection("past","Past","One row per event they have already run."));
  F.appendChild(eventSection("current","Current","One row per event on the table now."));

  /* vendor & offering */
  const s4=el("section","sec");
  s4.innerHTML=`<div class="sh"><h2>Vendor &amp; offering</h2></div>`;
  const b4=el("div","sb");
  b4.appendChild(field("Vendor info","f-vi",false,select("f-vi",VENDOR_INFO,a.vendorInfo,v=>a.vendorInfo=v)));

  const sf=el("div","f");
  const lab=el("label","cb1"+(a.serviceOffering?" on":""));
  lab.style.marginBottom="0";
  const c=el("input");c.type="checkbox";c.checked=a.serviceOffering;
  c.onchange=()=>{a.serviceOffering=c.checked;lab.className="cb1"+(c.checked?" on":"");};
  lab.appendChild(c);
  lab.appendChild(el("span",null,"Enout service offering<em>Tick if the offering was pitched on this call.</em>"));
  sf.appendChild(lab);b4.appendChild(sf);

  if(MEETING_STAGES.includes(a.stage)){
    b4.appendChild(field("Mode of meeting","f-mm",false,select("f-mm",MODE_OF_MEETING,a.modeOfMeeting,v=>a.modeOfMeeting=v)));
  }else{
    const lk=el("div","f");
    lk.innerHTML=`<div class="locked"><b>hidden</b><span>Mode of meeting opens only at stages
      ${MEETING_STAGES.map(s=>esc(s)).join(", ")}. Send your real stage list and I will swap these in.</span></div>`;
    b4.appendChild(lk);
  }
  s4.appendChild(b4);F.appendChild(s4);
}

function eventSection(key,title,sub){
  const a=rec();
  const s=el("section","sec"+(collapsed[key]?" collapsed":""));
  const h=el("div","sh");
  h.innerHTML=`<h2>${esc(title)}</h2><p>${esc(sub)}</p>`;
  const tg=el("button","shbtn",collapsed[key]?`▸ ${a[key].length} row${a[key].length===1?"":"s"}`:"▾ Hide");
  tg.type="button";tg.onclick=()=>{collapsed[key]=!collapsed[key];render();};
  h.appendChild(tg);s.appendChild(h);

  const b=el("div","sb");
  const rows=el("div","rows");
  if(!a[key].length)rows.appendChild(el("div","empty","No "+title.toLowerCase()+" events."));
  a[key].forEach((r,i)=>{
    const c=el("div","row");
    const rh=el("div","rowh");
    rh.innerHTML=`<span class="n">${esc(title)} ${i+1}</span>`;
    const d=el("button","del","×");d.type="button";d.setAttribute("aria-label","Remove row");
    d.onclick=()=>{a[key].splice(i,1);render();};
    rh.appendChild(d);c.appendChild(rh);

    const g=el("div","g2");
    g.appendChild(field("Event type",`${key}-et-${i}`,false,select(`${key}-et-${i}`,EVENT_TYPES,r.eventType,v=>{r.eventType=v;})));
    g.appendChild(quickField("Budget",`${key}-bd-${i}`,r.budget,"Whatever they said",v=>r.budget=v,QUICK.budget));
    c.appendChild(g);c.appendChild(el("div","f"));

    const g2=el("div","g2");
    g2.appendChild(quickField("Timeline",`${key}-tl-${i}`,r.timeline,"Quarter or month",v=>r.timeline=v,QUICK.timeline));
    g2.appendChild(quickField("Pax",`${key}-px-${i}`,r.pax,"Headcount",v=>r.pax=v,QUICK.pax));
    c.appendChild(g2);c.appendChild(el("div","f"));

    c.appendChild(field("Remarks",`${key}-rm-${i}`,false,textarea(`${key}-rm-${i}`,r.remarks,"Detail for the next call",v=>r.remarks=v)));
    rows.appendChild(c);
  });
  b.appendChild(rows);
  const add=el("button","add","+ Add "+title.toLowerCase()+" event");add.type="button";
  add.style.marginTop="10px";
  add.onclick=()=>{a[key].push(emptyRow());collapsed[key]=false;render();};
  b.appendChild(add);
  s.appendChild(b);return s;
}

/* ── validate + actions ──────────────────── */
function missing(){
  const a=rec(),m=[];
  if(!a.pocName.trim())m.push("POC name");
  if(!a.phones.some(p=>p.value.trim()))m.push("phone");
  if(!a.owner)m.push("owner");
  return m;
}
function validate(){
  const m=missing(),msg=document.getElementById("msg"),a=rec();
  document.getElementById("flagBtn").className="flagbtn"+(a.flagged?" on":"");
  if(m.length){msg.textContent="Needs "+m.join(", ");msg.className="msg bad";}
  else{msg.textContent=a.done?"Logged today.":"Ready to save.";msg.className="msg";}
}
function saveNext(){
  const m=missing();
  if(m.length){toast("Missing "+m.join(", "));return;}
  const a=rec(),was=a.done;
  a.done=true;stopTimer();secs=0;
  const from=cur;
  const rows=visible().filter(r=>r.i!==from);
  const nxt=rows.length?rows[0].i:cur;
  cur=nxt;isNew=false;collapsed={past:false,current:false};
  render();resetScroll();setTab("basic");
  toast(`${a.pocName} saved`,()=>{a.done=was;cur=from;render();});
}

/* ── shortcuts sheet ─────────────────────── */
function openKb(){
  const s=el("div","scrim");
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="kh">
    <div class="h"><h3 id="kh">Keyboard</h3><button class="gbtn" id="kx" type="button">Close</button></div>
    <div class="b">
      <div class="krow"><span class="kk"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd></span><span>Set the call outcome</span></div>
      <div class="krow"><span class="kk"><kbd>Enter</kbd></span><span>Save and jump to the next contact</span></div>
      <div class="krow"><span class="kk"><kbd>C</kbd></span><span>Dial the primary number</span></div>
      <div class="krow"><span class="kk"><kbd>F</kbd></span><span>Flag this record for end-of-day cleanup</span></div>
      <div class="krow"><span class="kk"><kbd>J</kbd> <kbd>K</kbd></span><span>Next / previous contact in the queue</span></div>
      <div class="krow"><span class="kk"><kbd>/</kbd></span><span>Jump to search</span></div>
      <div class="krow"><span class="kk"><kbd>Esc</kbd></span><span>Leave the field you are in</span></div>
      <div class="krow"><span class="kk"><kbd>?</kbd></span><span>This sheet</span></div>
    </div></div>`;
  document.body.appendChild(s);
  s.onclick=e=>{if(e.target===s)s.remove();};
  document.getElementById("kx").onclick=()=>s.remove();
}

/* ── wiring ──────────────────────────────── */
document.getElementById("q").addEventListener("input",renderQueue);
document.getElementById("qToggle").addEventListener("click",e=>{
  const m=document.getElementById("mid");m.classList.toggle("noq");
  e.target.classList.toggle("on",!m.classList.contains("noq"));
});
document.getElementById("qToggle").classList.add("on");
document.getElementById("kbBtn").addEventListener("click",openKb);
document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.getElementById("newBtn").addEventListener("click",()=>{
  DATA=[blank(),...DATA];cur=0;isNew=true;filter="all";renderFilters();render();
  resetScroll();
  setTimeout(()=>document.getElementById("f-poc")?.focus(),50);
});
document.getElementById("resetBtn").addEventListener("click",()=>{render();toast("Reset");});
document.getElementById("saveBtn").addEventListener("click",saveNext);
document.getElementById("flagBtn").addEventListener("click",()=>{
  const a=rec();a.flagged=!a.flagged;validate();renderQueue();
  toast(a.flagged?"Flagged for cleanup":"Flag removed");
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
});

document.addEventListener("keydown",e=>{
  const typing=e.target.matches("input,textarea,select");
  if(e.key==="Escape"){
    const sc=document.querySelector(".scrim");if(sc){sc.remove();return;}
    if(typing){e.target.blur();return;}
  }
  if(typing&&!(e.key==="Enter"&&(e.metaKey||e.ctrlKey)))return;
  if(e.key==="Enter"){e.preventDefault();saveNext();return;}
  const o=OUTCOMES.find(x=>x.k===e.key);
  if(o){e.preventDefault();setOutcome(o);return;}
  const k=e.key.toLowerCase();
  if(k==="c"){const a=rec(),p=a.phones.find(x=>x.primary)||a.phones[0];
    if(p&&p.value){startTimer();window.location.href="tel:"+(p.cc+p.value).replace(/\s/g,"");}return;}
  if(k==="f"){document.getElementById("flagBtn").click();return;}
  if(k==="j"||k==="k"){
    const rows=visible();const at=rows.findIndex(r=>r.i===cur);
    const nx=k==="j"?at+1:at-1;
    if(rows[nx]){cur=rows[nx].i;stopTimer();secs=0;render();resetScroll();}
    return;}
  if(e.key==="/"){e.preventDefault();document.getElementById("q").focus();return;}
  if(e.key==="?"){openKb();return;}
});

renderFilters();render();
</script>
