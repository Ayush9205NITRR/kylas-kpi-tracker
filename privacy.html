<!doctype html>
<!--
  ONE PRIVACY-POLICY URL, WHICHEVER WAY PAGES IS CONFIGURED.

  The Chrome Web Store listing needs a privacy policy URL, and the policy lives
  at docs/privacy.html. GitHub Pages serves that at one of two addresses
  depending on a setting nobody remembers having chosen:

    Pages source = /docs   ->  https://<user>.github.io/<repo>/privacy.html
    Pages source = root    ->  https://<user>.github.io/<repo>/docs/privacy.html

  Putting this redirect at the repo root makes the FIRST address work in both
  cases: with source=/docs it is never served and docs/privacy.html answers
  directly; with source=root it is served and sends the reader on. So the URL
  pasted into the store form keeps working if the Pages source is ever changed,
  which is the kind of thing that silently unpublishes a listing months later.

  It is a redirect and not a copy on purpose. Two copies of a privacy policy
  drift, and a policy that no longer describes what the software does is worse
  than a missing one — it is a false statement about somebody's data.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy policy — Enout BD Call Console</title>
  <meta http-equiv="refresh" content="0; url=docs/privacy.html">
  <link rel="canonical" href="docs/privacy.html">
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 34rem; margin: 20vh auto 0; padding: 0 1rem;
    }
    a { color: #4338CA; }
    @media (prefers-color-scheme: dark) { a { color: #A5B4FC; } }
  </style>
</head>
<body>
  <h1>Privacy policy</h1>
  <p>The policy for the Enout BD Call Console is at
     <a href="docs/privacy.html">docs/privacy.html</a>.</p>
  <p>If this page did not forward you automatically, follow that link.</p>
</body>
</html>
