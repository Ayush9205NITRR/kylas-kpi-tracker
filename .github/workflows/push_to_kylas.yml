# AIRTABLE -> KYLAS PUSH, AS A SCHEDULED JOB WITH NO TIME LIMIT.
#
# The Worker's own cron (02:45 IST, PUSH_LIMIT 100 writes, PUSH_READS 600 looks)
# is the small nightly. This is the big one: the same run() from
# scripts/push-kylas.mjs, on a GitHub runner, which has hours rather than a
# Worker's minutes. It is what catches up every contact the console holds
# something on — the remarks block (event details, vendor, mode, offering), the
# call-back and the offsite quarter — and keeps them current.
#
# Safe to overlap with the Worker's run and to repeat: a contact that already
# agrees with Kylas is skipped, so the second writer finds nothing to do. It
# stops itself if more than one in ten of the first twenty written is not fully
# pushed (the circuit breaker), and the job then goes red, which GitHub emails.
#
# NEEDS TWO REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#   KYLAS_KEY       the same Kylas API key as the Worker's
#   AIRTABLE_PAT    the same Airtable token
# The base id is not a secret (it is in wrangler.toml) and defaults to the KPI base;
# set a repository SECRET named AIRTABLE_BASE only to point it somewhere else.
# Without the two the run fails in its first second and says which one is missing.
name: Push Airtable to Kylas

on:
  schedule:
    # 21:47 UTC = 03:17 IST, after the Worker's 02:45 push has finished.
    - cron: '47 21 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to Kylas. "false" is a dry run: counts and examples, nothing written.'
        default: 'false'
      limit:
        description: 'Most WRITES this run makes. 0 = no limit.'
        default: '0'
      reads:
        description: 'Most contacts to LOOK AT. 0 = all of them.'
        default: '0'
      contact:
        description: 'One Kylas contact id only (blank = everyone).'
        default: ''

# Two runs at once would just race each other for the same contacts.
concurrency:
  group: push-to-kylas
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the secrets are there
        env:
          KYLAS_KEY: ${{ secrets.KYLAS_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE || 'appEwJu0bleHh9b8t' }}
        run: |
          for v in KYLAS_KEY AIRTABLE_PAT AIRTABLE_BASE; do
            if [ -z "${!v}" ]; then echo "::error::the repository secret $v is not set"; exit 1; fi
          done

      - name: Push
        env:
          KYLAS_KEY: ${{ secrets.KYLAS_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE || 'appEwJu0bleHh9b8t' }}
          # A scheduled run writes; a hand-started one writes only if asked to.
          APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          READS: ${{ github.event.inputs.reads || '0' }}
          CONTACT: ${{ github.event.inputs.contact || '' }}
        run: |
          ARGS="--limit $LIMIT --reads $READS"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "$CONTACT" ]; then ARGS="$ARGS --contact $CONTACT"; fi
          echo "node scripts/push-kylas.mjs $ARGS"
          node scripts/push-kylas.mjs $ARGS
