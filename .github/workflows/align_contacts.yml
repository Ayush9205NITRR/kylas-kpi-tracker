# EVERY CONTACT ON AN ACCOUNT BELONGS TO WHOEVER OWNS THE ACCOUNT.
#
# Ayush, 2026-10-22: "all associated contacts for that account should be
# allotted to whoever owns that account. Check for that."
#
#   check      every account from Kylas (the console's own crawl), the contacts
#              of each, the ones that are off read again owner included; the
#              report says how many, whose, and who holds them. Writes nothing.
#              About an hour for the whole CRM — `owners` narrows it.
#   first-one  moves the contacts of the first account to its owner — look at it in Kylas
#   all        the rest
#
# Accounts on the Super Admin or a deactivated user are only REPORTED: their
# contacts are never moved TO them — allot the account first.
# Logs print ids and BD names only: this repository's Actions logs are public.
name: Contacts follow their account's owner

on:
  workflow_dispatch:
    inputs:
      owners:
        description: 'only accounts these people own (first names or Kylas ids, comma separated); empty = every account'
        default: ''
      mode:
        description: 'contacts: an active BD''s account gets all its contacts · give-accounts: an account on the Super Admin or a deactivated user goes to the active BD holding most of its contacts · give-to-pool: the same, but ONLY to the pool below, and what an earlier give run put outside it is re-routed'
        type: choice
        default: 'contacts'
        options: [contacts, give-accounts, give-to-pool]
      pool:
        description: 'give-to-pool only: the user ids accounts may go to (Arshdeep, Muskan, Sejal, Mayra, Anjali, Gurnoor, Aditi)'
        default: '82866,82867,85880,74755,83129,82978,82994'
      snapshot_runs:
        description: 'give-to-pool only: earlier give runs whose before-images say who got what (run ids)'
        default: '39847571787,39849075307'
      step:
        description: 'check, first-one, or all'
        type: choice
        default: 'check'
        options: [check, first-one, all]

permissions:
  contents: read
  actions: read     # download the earlier runs' before-images

concurrency:
  group: tag-company-source
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KYLAS_KEY: ${{ secrets.KYLAS_KEY }}
      OWNERS: ${{ github.event.inputs.owners }}
      GH_TOKEN: ${{ github.token }}
      GIVE: ${{ github.event.inputs.mode == 'give-accounts' && '--give-accounts' || github.event.inputs.mode == 'give-to-pool' && format('--give-accounts --pool {0} --snapshots snaps', github.event.inputs.pool) || '' }}
      SNAP_RUNS: ${{ github.event.inputs.snapshot_runs }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the secrets are there
        run: |
          for v in KYLAS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::the repository secret $v is not set"; exit 1; fi
          done
      - name: Download the earlier give runs' before-images
        if: ${{ github.event.inputs.mode == 'give-to-pool' }}
        run: |
          mkdir -p snaps
          for r in ${SNAP_RUNS//,/ }; do gh run download "$r" -n "align-$r" -D "snaps/$r"; done
          echo "$(find snaps -name 'align-snapshot-*.json' | wc -l) before-image file(s)"
      - name: Check (writes nothing)
        if: ${{ github.event.inputs.step == 'check' }}
        run: node scripts/align-contacts.mjs ${OWNERS:+--owners "$OWNERS"} $GIVE
      - name: First account
        if: ${{ github.event.inputs.step == 'first-one' }}
        run: node scripts/align-contacts.mjs ${OWNERS:+--owners "$OWNERS"} $GIVE --apply --limit 1
      - name: All accounts
        if: ${{ github.event.inputs.step == 'all' }}
        run: node scripts/align-contacts.mjs ${OWNERS:+--owners "$OWNERS"} $GIVE --apply --all
      - name: Keep the plan and the before-images (ids and old owners only — for an undo)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: align-${{ github.run_id }}
          path: |
            align-plan.json
            align-snapshot-*.json
          if-no-files-found: ignore
          retention-days: 90
