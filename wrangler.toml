# How the proxy is deployed to Cloudflare. See docs/DEPLOY.md for the steps.
#
# THE THREE PLACEHOLDERS BELOW MUST BE FILLED IN before the first deploy, and
# they are marked FILL ME so a half-configured file cannot be mistaken for a
# finished one. Everything else has a working default.
#
# WHAT IS *NOT* IN THIS FILE, deliberately: the Kylas key and the Airtable
# token. This file is committed to git. Secrets go in with
#
#   npx wrangler secret put KYLAS_KEY
#   npx wrangler secret put AIRTABLE_PAT
#
# which sends them from your terminal to Cloudflare and stores them encrypted.
# A secret written here would be in the repository history for ever, and the
# only fix for that is a new key.

name = "enout-bd-proxy"
main = "worker/index.mjs"
compatibility_date = "2026-09-23"

# The proxy reaches Kylas and Airtable over the ordinary internet, which a
# Worker does not do by default in every configuration. This is also what lets
# the bundler see past any Node-shaped import in the graph.
compatibility_flags = ["nodejs_compat"]

# ── the address ────────────────────────────────────────────────────────────
# A custom domain, not a *.workers.dev subdomain — Cloudflare Access cannot be
# put in front of workers.dev, and without Access this has no login at all
# while holding a Kylas key and an Airtable token.
routes = [
  { pattern = "bd.enout.website", custom_domain = true }
]

# ── the save journal ───────────────────────────────────────────────────────
# D1 and not KV, and the difference is not a preference. KV is eventually
# consistent: it can answer "no contact was created for this key" for a key
# written a second ago in another location, and two retries of one save would
# then both create a contact — the exact duplicate the journal exists to
# prevent. See scripts/store.mjs.
#
#   npx wrangler d1 create enout-bd
#
# prints the database_id to paste below.
[[d1_databases]]
binding = "DB"
database_name = "enout-bd"
database_id = "fb652db4-d37a-4f9b-8b12-a23209603982"

# THE BINDING IS "DB" AND NOT WHAT `d1 create` SUGGESTS. Wrangler prints a
# ready-made block with binding = "enout_bd", derived from the database name,
# and pasting it whole is the obvious thing to do. The code reads env.DB, so
# that rename would make the Worker refuse to start — correctly, but with an
# error about a missing binding rather than about the name of one.

[vars]
# Only these origins are answered. Anything else gets no CORS headers at all,
# so the browser refuses it. An extension's id is on chrome://extensions with
# developer mode on, or at the end of its Web Store link.
#
# TWO OF THEM, AND THE SECOND ONE COST A DAY. A copy of an extension loaded
# unpacked gets a DIFFERENT id from the published one — they are the same code
# and, to everything that checks an id, two different extensions. So an
# unpacked copy is refused by this server AND by Google's redirect-uri check,
# and the errors name neither the id nor the fact that there are two.
#
#   infkkm…  the published extension, from the Chrome Web Store
#   abgnfh…  Ayush's local unpacked copy, for testing before a release
#
# Remove the second when the local copy is no longer used. Every id here is a
# build of this extension that can reach the CRM.
ALLOWED_ORIGIN = "chrome-extension://infkkmfegekmocfgjlhahdlheccojkdb,chrome-extension://abgnfhfbhiafcdakdgdmagjnilkiifgk"

# ── who is allowed to call this ────────────────────────────────────────────
# THERE IS NO DEFAULT. A server holding a Kylas key and an Airtable token must
# never be one forgotten variable away from being open, so an unset AUTH
# refuses to serve anything at all.
#
#   google   the extension signs in with Google and sends the ID token, which
#            is verified here against Google's published keys. Needs
#            GOOGLE_CLIENT_ID below. This is the one in use.
#   access   Cloudflare Access sits in front. Free up to 50 users but requires
#            a card on file, which is why it is not what we are using.
#   none     no check whatsoever. `wrangler dev` only. It logs a warning on
#            every request, because the way this ends badly is somebody
#            setting it "just to test" and leaving it.
AUTH = "google"

# From Google Cloud Console — see docs/DEPLOY.md part 6. NOT a secret: it
# identifies the application, it does not authorise anything. Its job here is
# to be the `aud` every token is checked against, which is what stops a Google
# token minted for somebody else's app being accepted as a login for this one.
GOOGLE_CLIENT_ID = "669836874556-44qeevcfed96d839lo86jp2quusm1m7d.apps.googleusercontent.com"

# Only addresses at this domain may sign in. Compared after splitting the
# address on "@" — "evil@notenout.in" ends with "enout.in" and must not pass.
ALLOWED_EMAIL_DOMAIN = "enout.in"

# Optional, comma-separated: individual addresses outside the domain, for a
# contractor. Every one is a person who can reach the CRM, so keep it empty
# unless there is a name that has to be here.
# ALLOWED_EMAILS = ""

# Which Airtable base holds the KPIs. Not a secret — the token is.
AIRTABLE_BASE = "appEwJu0bleHh9b8t"

# Shown in the console's build handshake, so a stale deploy is visible rather
# than merely suspected.
#
# Keep it equal to extension/manifest.json. The console compares the two and
# says "restart the proxy" when they differ, which is exactly right for a
# stale deploy and pure noise when they have merely drifted.
VERSION = "1.16.1"

# ── the nightly jobs ───────────────────────────────────────────────────────
# TIMES ARE UTC. IST is UTC+5:30, so a 02:00 IST run is 20:30 the PREVIOUS day
# in UTC — getting this wrong by one day is the classic mistake here. The
# comment beside each one is the IST time it actually fires.

# WHICH SCHEDULE IS WHICH JOB. Cloudflare tells the Worker the cron expression
# that fired and nothing else, so this is the only way to tell them apart —
# and these strings must match the ones above CHARACTER FOR CHARACTER. A
# mismatch is not an error anywhere: it is a job that silently never runs, so
# the Worker logs the cron it could not place along with all three of these.
#
# DAY OF WEEK IS A NAME, NOT A ZERO. Cloudflare rejects "0" for Sunday outright
# — "invalid cron string", at deploy time — even though it is ordinary crontab.
# Worse, it rejects it AFTER applying the schedules it did accept and does not
# roll those back, so a deploy can half-succeed. SUN is unambiguous everywhere.
CRON_SYNC = "30 20 * * *"
CRON_SNAPSHOT = "45 18 * * *"
CRON_ROLLUP = "0 21 * * SUN"
# Every five minutes: keeps the D1 copy of Airtable and the Kylas company list
# current (scripts/mirror.mjs). Idle overnight it makes no outside request.
CRON_MAINTAIN = "*/5 * * * *"

# How much raw call history to keep before the weekly rollup compacts it. 30
# days at this team's volume is ~18,000 rows; 90 would be ~54,000, which is
# over an Airtable Team base on its own.
CALL_RETAIN_DAYS = "30"

# How long the Kylas company crawl is used before the scheduled job refreshes
# it. Only matters while the list comes from Kylas (an unsynced base); requests
# never wait for the refresh.
COMPANY_TTL_MS = "900000"

[triggers]
crons = [
  "30 20 * * *",   # 02:00 IST, daily   · Kylas -> Airtable
  "45 18 * * *",   # 00:15 IST, daily   · freeze yesterday
  "0 21 * * SUN",  # 02:30 IST, Monday  · roll up the call log
  "*/5 * * * *",   # every 5 minutes    · keep the D1 copies current
]

[observability]
enabled = true
