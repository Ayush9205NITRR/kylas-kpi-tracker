# PASTE THIS INTO the kylas-airtable-sync repo as .github/workflows/copy_mail_secrets_to_bd_console.yml
#
# GitHub secrets cannot be read back, only used inside a workflow run of the repo
# that holds them. kylas-airtable-sync holds SMTP_USER / SMTP_PASS (the Gmail app
# password its emails already go out with). This workflow, run once by hand:
#   1. sends one test mail with them through the BD console's own SMTP code,
#      from the runner, so a wrong credential stops here and is never copied;
#   2. then sets them as Worker secrets on enout-bd-proxy (MAIL_SMTP_USER,
#      MAIL_SMTP_PASS, MAIL_TO), so the 06:00 digest can send.
# Needs two more secrets in THAT repo (Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id (Workers & Pages -> right-hand side)
# Delete both afterwards if nothing else uses them.
name: Copy mail secrets to the BD console

on:
  workflow_dispatch:
    inputs:
      mail_to:
        description: 'Where the daily digest goes (comma separated)'
        default: 'ayush@enout.in'
      copy:
        description: 'Copy the secrets to the Worker after a successful test mail'
        default: 'true'

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ayush9205NITRR/kylas-kpi-tracker
          ref: claude/adoring-feynman-chhiyt
          path: bd

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test mail (the real credentials, the BD console's SMTP code)
        working-directory: bd
        env:
          MAIL_SMTP_USER: ${{ secrets.SMTP_USER }}
          MAIL_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ github.event.inputs.mail_to }}
        run: node scripts/mail-test.mjs

      - name: Set the Worker secrets
        if: ${{ github.event.inputs.copy == 'true' }}
        working-directory: bd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ github.event.inputs.mail_to }}
        run: |
          printf '%s' "$SMTP_USER" | npx --yes wrangler@4 secret put MAIL_SMTP_USER --name enout-bd-proxy
          printf '%s' "$SMTP_PASS" | npx --yes wrangler@4 secret put MAIL_SMTP_PASS --name enout-bd-proxy
          printf '%s' "$MAIL_TO"   | npx --yes wrangler@4 secret put MAIL_TO        --name enout-bd-proxy
