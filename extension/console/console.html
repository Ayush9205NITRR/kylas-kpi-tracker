<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enout Call Console</title>
<!-- No remote stylesheet. Plus Jakarta Sans and IBM Plex Mono were fetched from
     fonts.googleapis.com on every open: a DNS lookup, a TLS handshake and two
     requests before the first glyph, on a console an associate opens all day and
     often on a hotel wifi. Both faces are replaced by the bundled ones in
     fonts.css; the mono uses of var(--m, ui-monospace) fall back to the system
     monospace, which is what they were already written to do. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="production.css">
</head>
<body>

<div class="app">

  <header class="bar">
    <div class="id"><div class="g">EN</div><h1>Call console</h1></div>
    <div class="pace"><span>Calls</span><b id="pcount">0</b><span class="meter"><i id="pbar" style="width:0%"></i></span><span id="ptarget">/ 100</span></div>
    <div class="acct" id="acct"></div>
    <div class="sp"></div>
    <!-- One group, so the actions can never wrap away from each other and
         land on a second row the bar has no height for. -->
    <div class="acts">
      <button class="gbtn" id="newBtn">+ New contact</button>
      <span class="link" id="linkState" title="Checking the proxy…">·</span>
      <button class="gbtn" id="dashBtn" title="Numbers, and the captured data">Dashboard</button>
      <span id="logCount" hidden>0</span>
      <button class="gbtn ovOnly" id="dockBtn" title="Dock to the side">Dock</button>
      <button class="gbtn ovOnly" id="closeBtn" title="Close (Esc)">Close</button>
    </div>
  </header>

  <div class="callbar"><div class="cbIn" id="callbar"></div></div>

  <div class="mid" id="mid">
    <aside class="queue">
      <div class="qmode" id="qmode"></div>
      <div class="qscope" id="qscope" hidden></div>
      <!-- The search box is gone. It promised "name, company, phone" and could
           not deliver any of the three: visible() narrows to the open company
           BEFORE the query runs, so searching a contact at another company, or
           any company name but the one you are in, returned nothing every time.
           A box that can only find what is already on screen is worse than no
           box, and the queue it sat over is a handful of rows. -->
      <div class="qtop">
        <div class="qfil" id="qfil"></div>
      </div>
      <button class="qnew" id="qNewBtn" type="button">+ New contact</button>
      <ul class="qlist" id="qlist"></ul>
    </aside>
    <div class="right">
      <div class="tabbar" role="tablist">
        <button role="tab" data-tab="basic" aria-selected="true">Basic info</button>
        <button role="tab" data-tab="more" aria-selected="false">Event &amp; vendor <span class="n" id="tabCount"></span></button>
      </div>
      <div class="split" id="split" data-tab="basic">
        <section class="pane" id="paneL">
          <div class="ph">Basic information<span class="c" id="phL"></span></div>
          <div class="pscroll" id="scrollL"><div class="pwrap" id="formL"></div></div>
        </section>
        <section class="pane" id="paneR">
          <div class="ph">Event &amp; vendor<span class="c" id="phR"></span></div>
          <div class="pscroll" id="scrollR"><div class="pwrap" id="formR"></div></div>
        </section>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport" hidden><div class="vwrap" id="vwrap"></div></div>

  <div class="foot" id="foot"><div class="footIn">
    <span class="msg" id="msg"></span>
    <button class="flagbtn" id="flagBtn" type="button">⚑ Flag for cleanup</button>
    <button class="gbtn" id="resetBtn" type="button">Reset</button>
    <button class="pbtn" id="saveBtn" type="button">Save &amp; next</button>
  </div></div>
</div>

<script src="stages.js"></script>
<script src="fields.js"></script>
<script src="offsite.js"></script>
<script src="store.js"></script>
<script src="api.js"></script>
<script src="console.js"></script>
<script src="views.js"></script>
<script src="overlay.js"></script>
</body>
</html>
