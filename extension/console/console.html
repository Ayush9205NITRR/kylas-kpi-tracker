<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enout Call Console</title>
<!-- No remote stylesheet. Plus Jakarta Sans and IBM Plex Mono were fetched from
     fonts.googleapis.com on every open: a DNS lookup, a TLS handshake and two
     requests before the first glyph, on a console an associate opens all day and
     often on a hotel wifi. Both faces are replaced by the bundled ones in
     fonts.css; the mono uses of var(--m, ui-monospace) fall back to the system
     monospace, which is what they were already written to do. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="production.css">
</head>
<body>

<div class="app">

  <header class="bar">
    <div class="id"><div class="g">EN</div><h1>Call console</h1></div>
    <!-- STATUS SITS WITH STATUS. The link pill was in the button row, so a
         server-version warning read as one more thing to press, and it cost
         the actions width they then clipped silently. -->
    <div class="pace"><span>Calls</span><b id="pcount">0</b><span class="meter"><i id="pbar" style="width:0%"></i></span><span id="ptarget">/ 100</span>
      <span class="link" id="linkState" title="Checking the proxy…">·</span></div>
    <!-- The company you are on: name, id, tiles, contacts, owner and the two
         actions. It used to be described here AND again in a band at the top
         of the left rail; the band is gone (Ayush, 2026-11-20: "isko top
         mein"). renderAccount() fills it. -->
    <div class="acct" id="acct"></div>
    <div class="sp"></div>
    <!-- One group, so the actions can never wrap away from each other and
         land on a second row the bar has no height for. Six controls now:
         there were ten, two of which went to the same place and one of which
         had been invisible since the day it was written. -->
    <div class="acts">
      <button class="gbtn" id="backBtn" type="button" hidden>← Accounts</button>
      <button class="gbtn" id="newBtn" type="button">+ New contact</button>
      <button class="gbtn" id="newCoBtn" type="button" title="Create a company in Kylas, with the details its score needs">+ New company</button>
      <button class="gbtn" id="todayBtn" type="button" title="The calls you owe today — overdue first">Today</button>
      <button class="gbtn" id="waBtn" type="button" title="Compose and queue WhatsApp messages — pick who, pick what, preview, queue">WhatsApp<i class="waN" hidden></i></button>
      <button class="gbtn" id="dealsBtn" type="button" title="Deals handed to Sales, their action items, and what is holding each one up">Deals<i class="dealsN" hidden></i></button>
      <button class="gbtn" id="dashBtn" type="button" title="The funnel ladder, talk time and RCA — yours or the team's">Dashboard</button>
      <!-- Counts, not sentences: three things that are only ever "how many",
           so they cost what one button used to. -->
      <span class="cnts">
        <button class="gbtn cnt" id="jobBtn" type="button" hidden title="Re-assignment running on the server"><i>Re-assigning</i></button>
        <button class="gbtn cnt" id="rcaBtn" type="button" hidden title="Stalled contacts that need a reason — and the reasons already given"><i>Reasons</i><b></b></button>
        <button class="gbtn cnt" id="flagsBtn" type="button" hidden title="Possible duplicate contacts waiting for an admin"><i>Flags</i><b></b></button>
      </span>
      <button class="gbtn ovOnly" id="dockBtn" title="Dock to the side">Dock</button>
      <button class="gbtn ovOnly" id="closeBtn" title="Close (Esc)">Close</button>
    </div>
  </header>

  <div class="callbar"><div class="cbIn" id="callbar"></div></div>

  <div class="mid" id="mid">
    <aside class="queue">
      <!-- THE RAIL IS THE CONTACT LIST, and nothing else (Ayush, 2026-11-16:
           "contact pane ke left ka UI not required"). The Company/Today tab
           switch and the ★ Focus / overdue summary went first; the company
           band followed it on 2026-11-20 — it said the same things the header
           already said, one band further down. The header is the company
           strip now. -->
      <!-- The search box is gone. It promised "name, company, phone" and could
           not deliver any of the three: visible() narrows to the open company
           BEFORE the query runs, so searching a contact at another company, or
           any company name but the one you are in, returned nothing every time.
           A box that can only find what is already on screen is worse than no
           box, and the queue it sat over is a handful of rows. -->
      <div class="qtop">
        <div class="qfil" id="qfil"></div>
      </div>
      <button class="qnew" id="qNewBtn" type="button">+ New contact</button>
      <ul class="qlist" id="qlist"></ul>
    </aside>
    <div class="right">
      <div class="tabbar" role="tablist">
        <button role="tab" data-tab="basic" aria-selected="true">Basic info</button>
        <button role="tab" data-tab="more" aria-selected="false">Event &amp; vendor <span class="n" id="tabCount"></span></button>
        <button role="tab" data-tab="research" aria-selected="false">Research</button>
      </div>
      <div class="split" id="split" data-tab="basic">
        <section class="pane" id="paneL">
          <div class="ph">Basic information<span class="c" id="phL"></span></div>
          <div class="pscroll" id="scrollL"><div class="pwrap" id="formL"></div></div>
        </section>
        <section class="pane" id="paneR">
          <div class="ph">Event &amp; vendor<span class="c" id="phR"></span></div>
          <div class="pscroll" id="scrollR"><div class="pwrap" id="formR"></div></div>
        </section>
        <!-- The account's research, to the right of the events: read before
             the call, never typed into. Its own pane when there is room. -->
        <section class="pane" id="paneX">
          <div class="ph">Account research<span class="c" id="phX"></span></div>
          <div class="pscroll" id="scrollX"><div class="pwrap" id="formX"></div></div>
        </section>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport" hidden><div class="vwrap" id="vwrap"></div></div>

  <div class="foot" id="foot"><div class="footIn">
    <span class="msg" id="msg"></span>
    <button class="flagbtn" id="flagBtn" type="button">⚑ Flag for cleanup</button>
    <button class="gbtn" id="resetBtn" type="button">Reset</button>
    <button class="pbtn" id="saveBtn" type="button">Save &amp; next</button>
  </div></div>
</div>

<script src="stages.js"></script>
<script src="fields.js"></script>
<script src="day.js"></script>
<script src="offsite.js"></script>
<script src="enrich.js"></script>
<script src="store.js"></script>
<script src="api.js"></script>
<script src="newco.js"></script>
<script src="focus.js"></script>
<script src="console.js"></script>
<script src="views.js"></script>
<script src="flags.js"></script>
<script src="overlay.js"></script>
</body>
</html>
